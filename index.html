<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Performance BMA III/IV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2a37; --muted:#6b7684; --line:#dfe4ea;
  --brand:#1f4e79; --brand-soft:#e8eff7; --brand-ink:#1f4e79;
  --head:#dce6f1; --head-ink:#1f3a5a; --total:#dce6f1;
  --g-bg:#e3f1e6; --g-ink:#1e6b34; --a-bg:#fdf1d8; --a-ink:#8a5a00; --r-bg:#fbe3e1; --r-ink:#a3262a;
  --hl:#fff9e6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial, "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif;font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;color:var(--brand)}
header .sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
.btn{border:1px solid #b9c9dc;background:var(--brand-soft);color:var(--brand-ink);border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.on{background:#cfdff0;border-color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
main{padding:14px 20px 40px;max-width:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;position:relative}
.cam{position:absolute;top:10px;right:12px}
.snapping .cam,.snapping .no-snap{display:none!important}
.snapping .tw{overflow:visible}
#main.snapping{background:var(--bg);padding-top:14px}
.dl{display:block;font-size:11px;font-weight:600;line-height:1.1}
.dl.up{color:#1e6b34}.dl.dn{color:#a3262a}.dl.eq{color:#6b7684}
.cmp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.cmp .lbl{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:15px;margin:4px 0 8px;color:var(--head-ink)}
.crit{color:var(--muted);font-size:13px;margin:0 0 10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:right;white-space:nowrap}
th{background:var(--head);color:var(--head-ink);font-weight:600;text-align:center}
td:first-child,th:first-child{text-align:left}
th.srt{cursor:pointer;user-select:none}
th .arr{font-size:10px;opacity:.55;margin-left:2px}
.snapping th .arr{display:none}
tr.tot td{background:var(--total);font-weight:700}
tr.hl td{background:var(--hl);font-weight:600}
tr.muted td{color:var(--muted)}
td.tl{text-align:center;color:var(--muted)}
tr.sep td{background:#f1f4f8;color:var(--head-ink);font-weight:700;text-align:left;padding:5px 9px}
td.g{background:var(--g-bg);color:var(--g-ink)} td.a{background:var(--a-bg);color:var(--a-ink)} td.r{background:var(--r-bg);color:var(--r-ink)}
tr.tot td.g,tr.tot td.a,tr.tot td.r{font-weight:700}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.line-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.line-box{border:1px solid var(--line);border-radius:10px;background:#fafbfd;display:flex;flex-direction:column}
.line-box .lh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;color:var(--head-ink)}
.line-box pre{margin:0;padding:10px;white-space:pre-wrap;font-family:inherit;font-size:13px;max-height:360px;overflow:auto;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f3a5a;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
td{background:var(--card)}
td:first-child,th:first-child{position:sticky;left:0;z-index:1}
td:first-child{box-shadow:1px 0 0 var(--line)}
.card>.row{padding-right:52px}
.tw{-webkit-overflow-scrolling:touch}
.swipe{display:none;color:var(--muted);font-size:12px;margin:-4px 0 6px}
@media (max-width:900px){
  main{max-width:none}
  .swipe{display:block}
}
@media (max-width:640px){
  .kgrid{grid-template-columns:1fr}
  html,body{font-size:13px}
  header,nav,main{padding-left:10px;padding-right:10px}
  header{padding-top:10px;padding-bottom:10px;gap:8px}
  header h1{font-size:16px}
  .cmp{margin-left:0;width:100%}
  .card{padding:12px 10px;border-radius:10px}
  .card h2{font-size:15px}
  table{min-width:0;font-size:12.5px}
  th,td{padding:5px 7px}
  th{white-space:normal;min-width:56px}
  td:first-child{max-width:150px;white-space:normal}
  .btn{padding:6px 11px}
  .btn.sm{padding:4px 9px;font-size:12.5px}
  .line-wrap{grid-template-columns:1fr}
  .line-box pre{max-height:300px;font-size:12.5px}
  .cam{top:8px;right:8px}
}
table.shopsc{min-width:0} table.shopsc th{white-space:normal;min-width:78px;max-width:120px;line-height:1.25;vertical-align:bottom} table.shopsc td{padding:5px 8px} table.shopsc td:first-child{white-space:normal;min-width:190px}
table.shopsc th small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.shopsc td:first-child,table.shopsc th:first-child{text-align:left;position:sticky;left:0;z-index:1}
table.shopsc td:first-child{background:#fff} table.shopsc th:first-child{background:var(--head)}
table.shopsc tr.tot td:first-child{background:var(--total)}
table.shopsc td.tg{color:var(--muted);text-align:center}
table.shopsc td.arv{font-weight:700;box-shadow:inset 0 0 0 2px #e5c76b}
table.shopsc tr.nc td:first-child{color:var(--muted)}
table.shopsc small.rk{display:block;font-size:11px;color:var(--muted);line-height:1.1}

/* ===== layout v2: เมนูด้านข้าง + การ์ดสรุป ===== */
.shell{display:flex;align-items:flex-start}
aside#side{width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:12px 10px 30px}
.content{flex:1;min-width:0}
.sg{margin-bottom:12px}
.sg h4{margin:6px 8px 6px;font-size:11.5px;letter-spacing:.3px;color:var(--muted);font-weight:600;text-transform:uppercase}
.sb{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.sb:hover{background:var(--brand-soft)}
.sb.on{background:var(--brand-soft);border-color:#b9c9dc;color:var(--brand);font-weight:700}
.sb .ic{width:20px;text-align:center}
.sb .nm{flex:1;min-width:0}
.sb .dots{display:flex;gap:3px}
.sb .dots i{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d5dbe3}
.dots i.g{background:#5aa96f}.dots i.a{background:#e0b04a}.dots i.r{background:#d9665f}
.side-legend{font-size:11.5px;color:var(--muted);margin:4px 8px 10px}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 20px 0}
.topbar .ttl{font-weight:700;color:var(--head-ink);font-size:15px}
.menu-btn{display:none}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;margin-bottom:14px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kc .kn{font-weight:700;color:var(--head-ink);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.kc .kt{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
.kc .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kc .ka{border-radius:10px;padding:8px 10px;background:#f6f8fb;border:1px solid var(--line)}
.kc .ka.g{background:var(--g-bg);border-color:#c5e3cd}.kc .ka.a{background:var(--a-bg);border-color:#f0d9a0}.kc .ka.r{background:var(--r-bg);border-color:#f2c4c0}
.kc .ka small{display:block;color:var(--muted);font-size:11.5px}
.kc .ka b{font-size:20px;display:block;line-height:1.25}
.kc .ka.g b{color:var(--g-ink)}.kc .ka.a b{color:var(--a-ink)}.kc .ka.r b{color:var(--r-ink)}
.kc .ka .rk{font-size:11.5px;color:var(--muted)}
.kc .kf{margin-top:6px;font-size:12px;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.big .kc b{font-size:26px;color:var(--brand);display:block}
.big .kc span{color:var(--muted);font-size:12.5px}
.overlay{display:none}
@media (max-width:900px){
  aside#side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.12)}
  body.menu-open aside#side{transform:none}
  body.menu-open .overlay{display:block;position:fixed;inset:0;background:rgba(15,25,40,.25);z-index:40}
  .menu-btn{display:inline-block}
  .topbar{padding:10px 10px 0}
}
.src{color:#8a94a2;font-size:12px;font-weight:400;margin:2px 0 8px}
table.b5 th.my3{background:var(--b3-hd);color:var(--b3-ink)} table.b5 td.myc3{box-shadow:inset 3px 0 0 #d9965a,inset -3px 0 0 #d9965a}
table.b5 th.my4{background:#e8def5;color:#5b3a8a} table.b5 td.myc4{box-shadow:inset 3px 0 0 #a98bd1,inset -3px 0 0 #a98bd1}
table.b5 tr.tot td.myc3{background:#f8dfc8} table.b5 tr.tot td.myc4{background:#e8def5}
.lg3,.lg4{display:inline-block;padding:0 6px;border-radius:4px;font-weight:600} .lg3{background:#f8dfc8;color:#8a4b12} .lg4{background:#e8def5;color:#5b3a8a}
.fv{margin-top:8px}
.fc{border:1px dashed var(--line);border-radius:10px;padding:6px 8px;background:#fbfcfd;min-width:0}
.fh{font-size:11px;color:var(--muted);font-weight:600;margin:4px 0 2px}
.fi{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.45}
.fi span{min-width:0}
.fi b{font-weight:600;white-space:nowrap}.fi b.g{color:var(--g-ink)}.fi b.a{color:var(--a-ink)}.fi b.r{color:var(--r-ink)}
.fi.muted{color:var(--muted);font-style:italic}

/* ===== สีประจำ Area: BMA III = ส้มพีช / BMA IV = ม่วงอ่อน ===== */
:root{--b3-bg:#fbeadb;--b3-hd:#f8dfc8;--b3-ink:#8a4b12;--b3-bd:#d9965a;--b4-bg:#f1eafa;--b4-hd:#e8def5;--b4-ink:#5b3a8a;--b4-bd:#a98bd1}
tr.hl3 td{background:var(--b3-bg);font-weight:600} tr.hl3 td:first-child{box-shadow:inset 4px 0 0 var(--b3-bd)}
tr.hl4 td{background:var(--b4-bg);font-weight:600} tr.hl4 td:first-child{box-shadow:inset 4px 0 0 var(--b4-bd)}
tr.hl3 td.g,tr.hl3 td.a,tr.hl3 td.r,tr.hl4 td.g,tr.hl4 td.a,tr.hl4 td.r{font-weight:700}
th.h3c{background:var(--b3-hd)!important;color:var(--b3-ink)!important} th.h4c{background:var(--b4-hd)!important;color:var(--b4-ink)!important}
.at3,.at4{display:inline-block;padding:0 7px;border-radius:5px;font-weight:700} .at3{background:var(--b3-hd);color:var(--b3-ink)} .at4{background:var(--b4-hd);color:var(--b4-ink)}
.ka small.l3{color:var(--b3-ink);font-weight:700} .ka small.l4{color:var(--b4-ink);font-weight:700}
.ka.b3{box-shadow:inset 0 3px 0 var(--b3-bd)} .ka.b4{box-shadow:inset 0 3px 0 var(--b4-bd)}
.fc.b3{border-color:var(--b3-bd)} .fc.b4{border-color:var(--b4-bd)}
table.shopsc td.arv.a3{box-shadow:inset 0 0 0 2px var(--b3-bd)} table.shopsc td.arv.a4{box-shadow:inset 0 0 0 2px var(--b4-bd)}

/* ===== หัว Dashboard แบบใหม่ ===== */
header{border-top:5px solid #1f4e79;padding:14px 22px;box-shadow:0 1px 4px rgba(15,30,50,.08)}
header h1{font-size:22px;color:#1f3a5a;letter-spacing:.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header h1 .t3,header h1 .t4{font-size:15px;padding:2px 10px;border-radius:999px;font-weight:700}
header h1 .t3{background:var(--b3-hd);color:var(--b3-ink)} header h1 .t4{background:var(--b4-hd);color:var(--b4-ink)}
.tagline{font-size:12.5px;color:#5a6776;margin-top:3px}
.side-built{margin:14px 8px 0;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot{padding:4px 20px 24px;font-size:12px;color:var(--muted)}
@media (max-width:640px){ header h1{font-size:18px} header h1 .t3,header h1 .t4{font-size:12.5px;padding:1px 8px} .tagline{font-size:11.5px} }

/* ===== การ์ด KPI แนวนอน: ตัวเลขซ้าย / สาขา Top-Focus ขวา ===== */
.kgrid{grid-template-columns:1fr!important}
.kbody{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:stretch}
.kv.fv{margin-top:0;grid-template-columns:1fr 1fr;gap:12px}
.fat{margin-bottom:4px}.fat .at3,.fat .at4{font-size:11.5px}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcols .fh{margin-top:0}
@media (max-width:1100px){ .kbody{grid-template-columns:1fr} }
@media (max-width:700px){ .kv.fv{grid-template-columns:1fr} }
@media (max-width:420px){ .fcols{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="ttlwrap"><h1>🏆 KPI Performance <span class="t3">BMA III</span><span class="t4">BMA IV</span></h1>
  <div class="tagline">สรุปผลงาน KPI รายวัน · Retail BMA North East &amp; South East</div></div>
  <div class="cmp"><span class="lbl">ขึ้น/ลง:</span>
    <button class="btn sm" data-cmp="none">ไม่แสดง</button>
    <button class="btn sm" data-cmp="prev">เทียบวันก่อน</button>
    <button class="btn sm" data-cmp="week">เทียบสัปดาห์ก่อน</button>
  </div>
</header>
<div class="overlay" id="ov"></div>
<div class="shell">
<aside id="side"></aside>
<div class="content">
<div class="topbar"><button class="btn sm menu-btn" data-menu="1">☰ เมนู</button><span class="ttl" id="ttl"></span><button class="btn sm" data-snapall="1" title="ถ่ายรูปทั้งหน้า (ไม่รวมข้อความ LINE)" style="margin-left:auto">📷 ทั้งหน้า</button></div>
<main id="main"></main>
<footer class="foot"><span class="built"></span> · KPI Performance BMA III / BMA IV</footer>
</div></div>
<div class="toast" id="toast">คัดลอกแล้ว — วางใน LINE ได้เลย</div>

  }
  const rest = tabs.filter(t=>!used.has(t.id));
  if (rest.length) h += `<div class="sg"><h4>อื่นๆ</h4>${rest.map(t=>`<button class="sb ${t.id===cur?'on':''}" data-tab="${t.id}"><span class="ic">${t.icon}</span><span class="nm">${esc(t.name)}</span></button>`).join('')}</div>`;
  h += `<div class="side-built built"></div>`;
  $('#side').innerHTML = h;
  document.querySelectorAll('.built').forEach(e=>e.textContent = '🕒 อัปเดตล่าสุด ' + DATA.built);
}
function kpiCards(id){
  const rows = DATA.score.rows.filter(r=>r.tab===id); if(!rows.length) return '';
  return `<div class="kgrid">` + rows.map(r=>{ const c=r.cells;
    const box=(lab,v,rk)=>`<div class="ka ${v.c||''} b${AC(lab)}"><small class="l${AC(lab)}">${lab}</small><b>${esc(v.v)}</b><span class="rk">${rk.v && rk.v!=='-' ? 'ลำดับ '+esc(rk.v)+'/15' : '&nbsp;'}</span></div>`;
    const F = (DATA.shop_score.focus||{})[r.sk];
    const fl = ar => { if(!F||!F[ar]) return ''; const x=F[ar]; const isNone = x.rule==='none';
      const top = x.top.length ? x.top.map(t=>`<div class="fi"><span>${esc(t[0])}</span><b class="g">${esc(t[1])}</b></div>`).join('') : `<div class="fi muted">${isNone?'-':'ยังไม่มีสาขาผ่านเป้าหมาย'}</div>`;
      const bot = x.bot.length ? x.bot.map(t=>`<div class="fi"><span>${esc(t[0])}</span><b class="${isNone?'':(t[2]||'r')}">${esc(t[1])}</b></div>`).join('') : `<div class="fi muted">ทุกสาขาผ่านเป้าหมาย</div>`;
      return `<div class="fc b${AC(ar)}"><div class="fat"><span class="at${AC(ar)}">${ar}</span></div><div class="fcols"><div><div class="fh">⬆ ${isNone?'สูงสุด':'ผ่านเป้าหมาย (Top)'}</div>${top}</div><div><div class="fh">⬇ ${isNone?'ต่ำสุด':'Focus (ยังไม่ผ่าน)'}</div>${bot}</div></div></div>`; };
    const focusHtml = F ? `<div class="kv fv">${fl('BMA III')}${fl('BMA IV')}</div>` : '';
    return `<div class="kc"><div class="kbody"><div class="kleft"><div class="kn"><span>${esc(c[0].v)}</span><span class="kt">${esc(c[1].v)}</span></div><div class="kv">${box('BMA III',c[2],c[3])}${box('BMA IV',c[4],c[5])}</div><div class="kf">ประเทศ ${esc(c[6].v)}${F?' · สาขา Focus ไม่นับสาขายอดน้อย':''}</div></div>${focusHtml}</div></div>`; }).join('') + `</div>`;
}
function scoreCards(){
  const rows = DATA.score.rows; const cnt = rows.filter(r=>!/^(ยังไม่มี|เทียบค่าเฉลี่ย)/.test(r.cells[1].v));
  const f = ci => ['g','a','r'].map(x=>cnt.filter(r=>r.cells[ci].c===x).length);
  const a3=f(2), a4=f(4), n=cnt.length;
  const card=(t,v,s)=>`<div class="kc"><span>${t}</span><b>${v}</b><span>${s}</span></div>`;
  return `<div class="big">${card('BMA III ผ่านเป้าหมาย', a3[0]+' / '+n, '🟡 '+a3[1]+' ช่วง Minimum · 🔴 '+a3[2]+' ไม่ผ่าน')}${card('BMA IV ผ่านเป้าหมาย', a4[0]+' / '+n, '🟡 '+a4[1]+' ช่วง Minimum · 🔴 '+a4[2]+' ไม่ผ่าน')}${card('ข้อมูลล่าสุด', esc(DATA.today), 'แต่ละ KPI ใช้รอบล่าสุดของ BI นั้น')}</div>`;
}

function render(){
  const tabs = [{id:'score',name:'Scorecard',icon:'📋'}, {id:'shop',name:'Scorecard รายสาขา',icon:'🏪'}, ...DATA.kpis];
  sideMenu(tabs);
  const curTab = tabs.find(t=>t.id===cur); $('#ttl').textContent = curTab ? curTab.icon+' '+curTab.name : '';
  let h = '';
  if (cur === 'score'){
    TEXTS['score'] = DATA.score_line;
    h += bma5();
    h += scoreCards();
    h += `<div class="card">${CAM}<h2>📋 Scorecard ทุก KPI</h2><p class="crit">ข้อมูลวันที่ ${esc(DATA.today)}</p><div class="src">แหล่งข้อมูล: Power BI (Retail Operation) และ dashboard.retailww.com (Retention) — รายละเอียดแหล่งของแต่ละ KPI ดูที่หัวแต่ละแท็บ</div>${LEG}${cmpNote()}<div style="height:8px"></div>${table(DATA.score)}</div>`;
    h += `<div class="card no-snap line-card"><h2>💬 ข้อความส่ง LINE</h2><div class="line-wrap">${lineBox('สรุป KPI ทุกตัว','score',DATA.score_line)}</div></div>`;
  } else if (cur === 'shop'){
    h += shopView();
  } else {
    const k = DATA.kpis.find(x=>x.id===cur);
    TEXTS[k.id+'-ov']=k.line.overview; TEXTS[k.id+'-b3']=k.line.b3; TEXTS[k.id+'-b4']=k.line.b4;
    const sub = `<p class="crit">${k.icon} ${esc(k.name)} · ข้อมูล ณ ${esc(k.asof)}</p>`;
    h += `<div class="card"><h2>${k.icon} ${esc(k.name)}</h2><p class="crit">ข้อมูล ณ ${esc(k.asof)} · ${esc(k.criteria)}</p>${k.source?`<div class="src">แหล่งข้อมูล: ${esc(k.source)}</div>`:''}${LEG}${cmpNote()}</div>`;
    h += kpiCards(k.id);
    h += `<div class="card">${CAM}${sub}${k.area_tables.map(table).join('')}</div>`;
    if (k.type_tables && k.type_tables.length) h += `<div class="card">${CAM}${sub}${k.type_tables.map(table).join('')}</div>`;
    const tts = ['ทั้งหมด', ...new Set(['BMA III','BMA IV'].flatMap(a=>k.shop_tables[a].flatMap(t=>t.rows.map(r=>r.t))).filter(Boolean))];
    const order = ['ทั้งหมด','Matching','Non Matching','DTAC Hall','DTAC COCO',"Lotus's",'อื่นๆ'];
    tts.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    if (!tts.includes(tf)) tf = 'ทั้งหมด';
    const tsel = tts.map(x=>`<button class="btn sm ${x===tf?'on':''}" data-tf="${esc(x)}">${esc(x)}</button>`).join('');
    const tsub = tf==='ทั้งหมด' ? sub : sub.replace('</p>', ` · Type Shop: ${esc(tf)}</p>`);
    const ctrl = `<div class="row no-snap"><span class="hint">Type Shop (ใช้กับ BMA III และ BMA IV):</span>${tsel}</div>`;
    // แสดงรายสาขา BMA III แล้วต่อด้วย BMA IV ด้านล่างเสมอ
    ['BMA III','BMA IV'].forEach((ar,i)=>{
      const shown = k.shop_tables[ar].map(t=>table(t, tf)).filter(Boolean).join('<div style="height:14px"></div>') || `<h3>รายสาขา ${ar}</h3><p class="hint">ไม่มีสาขาใน Type นี้</p>`;
      h += `<div class="card">${CAM}${(i===0 && !snapAll) ? ctrl : ''}${tsub}${shown}</div>`;
    });
    h += `<div class="card no-snap line-card"><h2>💬 ข้อความส่ง LINE</h2><div class="line-wrap">${lineBox('1) ภาพรวม Area',k.id+'-ov',k.line.overview)}${lineBox('2) BMA III',k.id+'-b3',k.line.b3)}${lineBox('3) BMA IV',k.id+'-b4',k.line.b4)}</div></div>`;
  }
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-cmp]').forEach(b=>b.classList.toggle('on', b.dataset.cmp===cmp));
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600); }
async function snap(card){
  if (typeof html2canvas === 'undefined'){ toast('โหลดเครื่องมือถ่ายรูปไม่ได้ (ต้องต่ออินเทอร์เน็ต)'); return; }
  card.classList.add('snapping');
  const w = Math.max(card.scrollWidth, ...[...card.querySelectorAll('table')].map(t=>t.scrollWidth+40));
  try {
    const canvas = await html2canvas(card, {scale:2, backgroundColor:'#ffffff', windowWidth: w + 80, width: w + 4});
    card.classList.remove('snapping');
    const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
    try { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast('คัดลอกรูปแล้ว — วางใน LINE ได้เลย (Ctrl+V)'); }
    catch(e){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='KPI_'+cur+'_'+DATA.today+'.png'; a.click(); toast('บันทึกรูปเป็นไฟล์แล้ว'); }
  } catch(e){ card.classList.remove('snapping'); toast('ถ่ายรูปไม่สำเร็จ'); }
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('คัดลอกแล้ว — วางใน LINE ได้เลย');
}
document.addEventListener('click', e=>{
  const th = e.target.closest('th.srt');
  if (th){
    const k = th.dataset.sk, c = +th.dataset.sc, s = SORT[k];
    if (!s || s.col !== c) SORT[k] = {col:c, dir:-1};        // ครั้งแรก: มาก → น้อย
    else if (s.dir === -1) SORT[k] = {col:c, dir:1};          // ครั้งที่ 2: น้อย → มาก
    else delete SORT[k];                                      // ครั้งที่ 3: กลับลำดับเดิม
    render(); return;
  }
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.menu){ document.body.classList.toggle('menu-open'); return; }
  if (b.dataset.tab){ document.body.classList.remove('menu-open'); window.scrollTo(0,0); cur=b.dataset.tab; try{localStorage.setItem('kpi_tab',cur)}catch(e){}; render(); }
  else if (b.dataset.ss){ const n=b.dataset.ss; if(n==='*') ss=null; else { if(!ss) ss=new Set(); ss.has(n)?ss.delete(n):ss.add(n); if(!ss.size) ss=null; } render(); }
  else if (b.dataset.area){ ss=null; area=b.dataset.area; try{localStorage.setItem('kpi_area',area)}catch(e){}; render(); }
  else if (b.dataset.copy){ copyText(TEXTS[b.dataset.copy]); }
  else if (b.dataset.tf){ tf=b.dataset.tf; ss=null; render(); }
  else if (b.dataset.cmp){ cmp=b.dataset.cmp; try{localStorage.setItem('kpi_cmp',cmp)}catch(e){}; render(); }
  else if (b.dataset.snap){ snap(b.closest('.card')); }
  else if (b.dataset.snapall){ snapAll = true; render(); snap($('#main')).finally(()=>{ snapAll = false; render(); }); }
});
document.getElementById('ov').addEventListener('click',()=>document.body.classList.remove('menu-open'));
document.querySelectorAll('.built').forEach(e=>e.textContent = '🕒 อัปเดตล่าสุด ' + DATA.built);
if (![ 'score', 'shop', ...DATA.kpis.map(k=>k.id)].includes(cur)) cur='score';
render();
</script>
